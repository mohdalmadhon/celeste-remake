<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste Remake</title>
    <meta name="description" content="A fan remake of Celeste that runs in the browser: five chapters, a level editor and seven languages, built with plain JavaScript and the DOM.">
    <meta name="theme-color" content="#0d0f2c">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Celeste Remake">
    <meta property="og:description" content="Climb the mountain in your browser. Five chapters, a level editor and seven languages.">
    <meta property="og:image" content="./assets/generated/checkpoints/summit.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="./assets/generated/ui/favicon.png">
    <link rel="preload" href="./assets/fonts/tiny5-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./css/game.css">
</head>

<body>
    <div id="app">
        <div id="stage">
            <div id="game" class="game" aria-label="Celeste">
                <div id="world" class="world"></div>
                <div id="vignette" class="vignette"></div>
                <div id="flash" class="flash"></div>
                <div id="letterbox" class="letterbox">
                    <div class="bar bar-top"></div>
                    <div class="bar bar-bottom"></div>
                </div>
                <div id="hud" class="hud hidden"></div>
                <div id="toast" class="toast" role="status" aria-live="polite"></div>
                <div id="chapter-card" class="chapter-card" aria-live="polite">
                    <div class="chapter-card-name"></div>
                    <div class="chapter-card-sub"></div>
                </div>
                <div id="dialogue" class="dialogue hidden"></div>
                <div id="screens" class="screens"></div>
                <div id="transition" class="transition"></div>
                <div id="perf" class="perf hidden" aria-hidden="true"></div>
                <noscript class="noscript">JavaScript is required to play.</noscript>
            </div>
        </div>
        <div id="controls-guide" class="controls-guide"></div>
    </div>
    <div id="editor" class="editor hidden"></div>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
